name: Frontend CI
on:
  pull_request:
    branches: [main, "ai/**"]
  push:
    branches: [main, "ai/**"]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate
  match-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crew
          POSTGRES_PASSWORD: crew_ci_only
          POSTGRES_DB: crew_e2e
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U crew -d crew_e2e" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:8
        ports: ["6379:6379"]
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-never-use-in-production
      DATABASE_URL: postgres://crew:crew_ci_only@127.0.0.1:5432/crew_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ibrodevs/among-us-backend
          ref: ai/backend-gameplay
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r backend/requirements.lock.txt
      - run: cmp src/features/game/engine/map.json backend/game/map.json
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start real stack and test complete matches
        run: |
          python backend/manage.py migrate --noinput
          (cd backend && daphne -b 127.0.0.1 -p 8000 config.asgi:application > /tmp/crew-api.log 2>&1) &
          python backend/manage.py run_game_worker > /tmp/crew-clock.log 2>&1 &
          npm run start > /tmp/crew-frontend.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://localhost:3000/ -o /dev/null && curl -fsS http://localhost:8000/api/v1/health/ -o /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-match-screens
          path: |
            test-results/*.png
            test-results/match-*.json
